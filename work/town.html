<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fog Town · Nihaal's work</title>
  <meta name="robots" content="noindex">
  <script src="town/mem.js" defer></script>
  <script src="town/core.js" defer></script>
  <script src="town/kit.js" defer></script>
  <script src="town/layers.js" defer></script>
  <script src="town/street.js" defer></script>
  <script src="town/props.js" defer></script>
  <script src="town/light.js" defer></script>
  <script src="town/lighting.js" defer></script>
  <script src="town/shops.js" defer></script>
  <script src="town/sound.js" defer></script>
  <script src="town/body2.js" defer></script>
  <script src="town/cast2.js" defer></script>
  <script src="town/world.js" defer></script>
  <script src="town/scene.js" defer></script>
  <script src="town/life.js" defer></script>
  <script src="town/engine.js" defer></script>
  <style>
    @font-face { font-family: "VT323"; src: url(../fonts/vt323.woff2) format("woff2"); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #121110; color: #e8e3d6; font-family: "VT323", monospace; overflow: hidden; }
    .stage { position: absolute; inset: 0; margin: auto; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    #rust, #torch { opacity: 0; }
    #torch { image-rendering: auto; }
    .spots a { position: absolute; display: block; border: 2px solid transparent; border-radius: 2px; outline: none; }
    /* no outline on hover (the lit door and the caption say what you're pointing at); keyboard users still see where they are */
    .spots a:focus-visible { border-color: rgba(201,165,90,0.85); }
    .under .spots a:focus-visible { border-color: rgba(224,160,64,0.9); }
    .spots a.rust-only { display: none; } .under .spots a.rust-only { display: block; } .under .spots a.surface-only { display: none; }
    .hud { position: fixed; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 3; }
    .hud > * { pointer-events: auto; }
    .tag { background: rgba(18,17,16,0.78); border: 1px solid rgba(232,227,214,0.35); padding: 6px 12px; font-size: 22px; color: #e8e3d6; text-decoration: none; letter-spacing: 1px; }
    .hud .right { display: flex; gap: 8px; }
    button.tag { cursor: pointer; font-family: inherit; }
    button.tag:hover, a.tag:hover { background: #e8e3d6; color: #22211f; }
    .under button.tag#lever { border-color: #e0a040; color: #e0a040; }
    .caption { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 3; background: rgba(18,17,16,0.82); border: 1px solid rgba(232,227,214,0.3); padding: 8px 16px; font-size: 22px; text-align: center; min-width: 360px; max-width: 90vw; }
    .caption small { display: block; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; color: #b9b5aa; }
    /* one panel for everything that pops up: a glimpse through a window, the payphone, the vending machine */
    .modal { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(8,8,8,0.55); }
    .modal[hidden] { display: none; }
    .panel { position: relative; width: min(420px, 92vw); background: #1b1a18; border: 2px solid #5f5c55; box-shadow: 0 0 0 4px #121110, 0 18px 40px rgba(0,0,0,0.5); padding: 18px 20px 16px; }
    .panel .x { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: #b9b5aa; font: 26px/1 "VT323", monospace; cursor: pointer; }
    .panel h2 { margin: 0 0 10px; font-size: 28px; letter-spacing: 1px; color: #e8e3d6; }
    .panel canvas { display: block; width: 100%; image-rendering: pixelated; border: 2px solid #2a2826; margin: 0 0 12px; }
    .panel p { margin: 0 0 12px; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; color: #d9d5c9; }
    .panel .acts { display: flex; flex-wrap: wrap; gap: 8px; }
    .panel .acts a { font-size: 20px; color: #22211f; background: #c9a55a; padding: 4px 12px; text-decoration: none; }
    .panel .acts a.alt { background: none; color: #e8e3d6; border: 1px solid #5f5c55; }
    .card { background: #ece6d6; color: #22211f; padding: 14px 16px; border-left: 6px solid #c84a3a; font: 17px/1.45 "Segoe UI", system-ui, sans-serif; margin: 0 0 12px; }
    .zoom .stage { inset: auto; margin: 0; transform-origin: 0 0; } .zoom .hud, .zoom .caption { display: none; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="fog" aria-hidden="true"></canvas>
    <canvas id="rust" aria-hidden="true"></canvas>
    <canvas id="torch" aria-hidden="true"></canvas>
    <nav class="spots" id="spots" aria-label="The town: every sign is a page"></nav>
  </div>
  <div class="hud">
    <a class="tag" href="/">NIHAAL · WORK</a>
    <div class="right">
      <button class="tag" id="light" type="button" title="How strong the street lights are">LIGHT: SOFT</button>
      <button class="tag" id="sound" type="button" aria-pressed="false">SOUND: OFF</button>
      <button class="tag" id="lever" type="button">PULL THE LEVER</button>
    </div>
  </div>
  <div class="caption" id="caption"></div>
  <div class="modal" id="modal" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="m-title"><button class="x" type="button" aria-label="Close">×</button><h2 id="m-title"></h2><canvas id="room" width="320" height="200" hidden></canvas><div id="m-body"></div><div class="acts" id="m-acts"></div></div></div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var T = window.FogTown, W = T.W, H = T.H;
  var HINT = 'EVERY SIGN IS A LINK<small>Pull the lever on the green switch box to see what\'s underneath. Some windows are lit; you can look in.</small>';
  var HINT_UNDER = 'UNDERNEATH<small>The wiring, the rules, and the leads that leaked. Move the torch around.</small>';
  // what you see through a lit window, by building
  var ROOMS = {
    about: ['office', 'Someone is filing paperwork. A long time ago, that was me.', './#about', 'ABOUT'],
    how: ['study', 'A mock-up taped to the wall, and a test suite running.', './#how', 'HOW I WORK'],
    work: ['late', 'Still up, reading one lead\'s journey a line at a time.', './#work', 'MY WORK'],
    writing: ['reading', 'A draft, crossed out, written again.', './#writing', 'WRITING'],
    toolkit: ['bench', 'Every tool on the wall has its own label.', './#toolkit', 'TOOLKIT'],
    hotel: ['hotel', 'A room upstairs. The bed hasn\'t been slept in. There\'s a number on the notepad by the phone.', './#contact', 'CONTACT']
  };
  // the vending machine: one fact per can, none repeated until they've all come out
  var FACTS = [
    'Every new screen starts as a mock-up. Moving a chart there costs a minute. In code it costs a release.',
    'After every write to another system, I read the record back. "200 OK" only means it heard you.',
    'Every odd piece of data gets an ID, a written note, a comment at the line of code and a test named after it.',
    'One change per pull request. Each one can be read in a few minutes and undone in one click.',
    'About 1,600 automated tests run before anything reaches the people who use it.',
    'If I explain something to the AI twice, it goes into the project\'s memory file.',
    'Live data is read-only while I investigate. Fixing it is a separate step I decide on.',
    'One page went from 34.5 seconds to 36 milliseconds.',
    'Making calls should be easy: two or three taps from opening the app to calling.',
    'Simple is the hard version. Adding a feature takes a prompt. Deciding it shouldn\'t be there takes thinking.',
    'If you clock in today, you get leads tomorrow.',
    'Every bug fix comes with the test that would have caught it.'
  ];
  var deck = [];
  function nextFact() { if (!deck.length) { deck = FACTS.slice(); for (var i = deck.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = deck[i]; deck[i] = deck[j]; deck[j] = t; } } return deck.pop(); }
  var news = { title: 'Eight apps, one set of rules', href: '../articles/eight-apps-one-set-of-rules.html' };
  fetch('../feed.xml').then(function (r) { return r.text(); }).then(function (x) { var d = new DOMParser().parseFromString(x, 'text/xml'), it = d.querySelector('item'); if (!it) return; var title = it.querySelector('title').textContent.split(':')[0], slug = it.querySelector('link').textContent.replace(/\/$/, '').split('/').pop(); news = { title: title, href: '../articles/' + slug + '.html' }; spotEls.news.href = news.href; }).catch(function () {});
  // [id, link, sign, what it is, x, y, w, h (art pixels), only (rust | surface), building for windows and doors]
  var visits = 0; try { visits = +(localStorage.getItem('ft-visits') || 0) + 1; localStorage.setItem('ft-visits', visits); } catch (e) {}
  var SPOTS = [
    ['wires', './#work', 'THE WIRES', 'The leads that leaked, and how I found them', 0, 100, 1280, 110, 'rust'],
    ['edge', null, '', '', -10, 200, 68, 320, 'surface', 'edge'],
    ['laundry', null, 'THE LAUNDROMAT', 'Open all hours. Someone is always waiting on a wash.', 424, 330, 84, 190, 'surface', 'laundry'],
    ['about', './#about', 'ABOUT', 'From insurance paperwork to business systems', 60, 186, 190, 334, null, 'about'],
    ['how', './#how', 'HOW I WORK', 'Where AI fits, and what keeps it honest', 272, 232, 148, 288, null, 'how'],
    ['work', './#work', 'MY WORK', "Tatiana's Diner, open all night. Case studies: the problem, what I found, what I built", 513, 186, 254, 334, null, 'work'],
    ['writing', './#writing', 'WRITING', 'What breaks and what works, every two weeks', 778, 286, 130, 234, null, 'writing'],
    ['earlier', './#earlier', 'EARLIER WORK', 'Client websites from before', 770, 170, 146, 60],
    ['toolkit', './#toolkit', 'TOOLKIT', 'The tools I build with', 916, 170, 174, 350, null, 'toolkit'],
    ['switch', '#lever', 'THE SWITCH', 'Pull the lever to see what\'s underneath', 1151, 398, 48, 122, null, 'switch'],
    ['hotel', './#contact', 'CONTACT', 'The hotel lobby: CV, LinkedIn and email', 1198, 118, 92, 402, null, 'hotel'],
    ['vending', '#vend', 'THE VENDING MACHINE', 'Buy a can. Each one comes with something I believe about building.', 212, 456, 36, 68, 'surface'],
    ['news', news.href, 'THE NEWS STAND', 'Today\'s paper: the latest article', 1102, 432, 48, 88, null, 'news'],
    ['contact', './#contact', 'THE PAYPHONE', 'It rings now and then. Pick it up if it does.', 238, 466, 40, 112],
    ['busstop', null, 'THE BUS STOP', 'Route 9. People wait here; the bus comes every few minutes.', 344, 498, 92, 80, 'surface'],
    ['missing', '#missing', 'A POSTER', 'Someone has lost their dog.', 346, 514, 16, 22, 'surface'],
    ['timetable', '#timetable', 'THE TIMETABLE', 'Route 9, and something written underneath.', 422, 510, 16, 26, 'surface'],
    ['missing2', '#missing2', 'ANOTHER POSTER', 'This one wasn\'t here before.', 17, 426, 24, 26, 'surface'],
    ['home', './', 'MERGE NOTES · POP. 1', 'Home', 6, 478, 104, 50]
  ];
  var stage = document.getElementById('stage'), spots = document.getElementById('spots'), cap = document.getElementById('caption'), lever = document.getElementById('lever'), soundBtn = document.getElementById('sound');
  var modal = document.getElementById('modal'), mTitle = document.getElementById('m-title'), mBody = document.getElementById('m-body'), mActs = document.getElementById('m-acts'), room = document.getElementById('room');
  // While the plain portfolio is being finished, the town links to the main site's pages; parts of town without a
  // page yet open a short note instead of a dead link
  var LIVE = { './#about': '/about', './#contact': '/contact', './#writing': '/articles', './': '/' }, SOON = /^\.\/#(work|how|earlier|toolkit)$/;
  function route(h) { return LIVE[h] !== undefined ? LIVE[h] : h; }
  function soon(title) { open(title, '<p>The write-ups for this part of town are on their way.</p><p>In the meantime, you can read about me or get in touch.</p>', [['About me', '/about'], ['Get in touch', '/contact', 1]]); }
  var capDefault = HINT, town, spotEls = {};
  cap.innerHTML = HINT;
  function art(e) { var b = stage.getBoundingClientRect(); return [(e.clientX - b.left) / b.width * W, (e.clientY - b.top) / b.height * H]; }
  function open(title, body, acts, roomKind) {
    mTitle.textContent = title; mBody.innerHTML = body; mActs.innerHTML = '';
    (acts || []).forEach(function (a) { if (SOON.test(a[1])) return; var el = document.createElement('a'); el.textContent = a[0]; el.href = route(a[1]); if (a[2]) el.className = 'alt'; mActs.appendChild(el); });
    room.hidden = !roomKind; if (roomKind) T.paintRoom(room, roomKind);
    modal.hidden = false; modal.querySelector('.x').focus();
  }
  function close() { modal.hidden = true; }
  modal.addEventListener('click', function (e) { if (e.target === modal) close(); }); modal.querySelector('.x').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) close(); });
  SPOTS.forEach(function (s) {
    var a = document.createElement('a'); if (s[1]) a.href = route(s[1]); else { a.href = '#'; a.className = 'quiet'; a.tabIndex = -1; }
    if (s[2]) a.setAttribute('aria-label', s[2] + ': ' + s[3]); else a.setAttribute('aria-hidden', 'true');
    if (s[8] === 'rust') a.classList.add('rust-only'); if (s[8] === 'surface') a.classList.add('surface-only');
    a.style.left = (s[4] / W * 100) + '%'; a.style.top = (s[5] / H * 100) + '%'; a.style.width = (s[6] / W * 100) + '%'; a.style.height = (s[7] / H * 100) + '%';
    var show = function () { if (s[0] === 'news') cap.innerHTML = 'THE NEWS STAND<small>Today\'s paper: ' + news.title + '</small>'; else if (s[0] === 'contact' && town && town.ringing()) cap.innerHTML = 'THE PHONE IS RINGING<small>Pick it up.</small>'; else if (s[2]) cap.innerHTML = s[2] + '<small>' + s[3] + '</small>'; if (s[9] && town) town.hover(s[9]); };
    a.addEventListener('mouseenter', show); a.addEventListener('focus', show);
    a.addEventListener('mouseleave', function () { cap.innerHTML = capDefault; if (town) town.hover(null); });
    a.addEventListener('click', function (e) {
      var p = art(e);
      if (s[9] && !document.body.classList.contains('under')) { var w = town.windowAt(p[0], p[1]); if (w) { e.preventDefault(); var R = ROOMS[w.b] || ['home', 'Someone\'s home. They haven\'t noticed you.']; open('A LIT WINDOW', '<p>' + R[1] + '</p>', R[2] ? [['GO TO ' + R[3], R[2]]] : [], R[0]); return; } }
      if (s[0] === 'switch') { e.preventDefault(); flip(!document.body.classList.contains('under')); return; }
      if (s[0] === 'missing') { e.preventDefault(); open('MISSING', '<div class="card"><b>Small grey dog. Answers to Pepper.</b><br>Last seen by the news stand, after dark. She\'s friendly and she always comes home.<br><br>Please call.</div><p>All the tear-off tabs are gone but one. Someone has drawn a line through the phone number.</p>', []); return; }
      if (s[0] === 'missing2') { e.preventDefault(); open('MISSING', '<div class="card"><b>Have you seen her?</b><br>Last seen after dark by the news stand, putting up posters for her dog.<br><br>Please call.</div><p>It\'s the same handwriting as the poster at the bus stop.</p>', []); return; }
      if (s[0] === 'timetable') { e.preventDefault(); open('ROUTE 9 · MERGE ST', '<p>Every 20 minutes, 6 AM to midnight.</p><p>Underneath, in pen, someone has written: <i>the last one doesn\'t stop here anymore.</i></p>', []); return; }
      if (!s[1]) { e.preventDefault(); return; }
      if (SOON.test(s[1])) { e.preventDefault(); soon(s[2]); return; }
      if (s[0] === 'vending') { e.preventDefault(); town.vend(); var f = nextFact(); setTimeout(function () { open('A CAN DROPS OUT', '<div class="card">' + f + '</div>', [['How I work', './#how', 1]]); }, 650); return; }
      if (s[0] === 'contact' && town.ringing()) { e.preventDefault(); town.answer(); open('HELLO?', '<p>…</p><p>Oh. You actually picked up.</p><p>I\'m Nihaal. I build the systems a sales team runs on. If you\'d like to talk about work, here\'s how to reach me.</p>', [['CV (PDF)', '#'], ['LinkedIn', '#'], ['Email', '#'], ['Contact page', './#contact', 1]]); return; }
    });
    if (s[0] === 'missing2' && visits < 2) a.hidden = true;   // only for people who have been here before
    spots.appendChild(a); spotEls[s[0]] = a;
  });
  function flip(under) {
    if (!town.flip(under)) return;
    document.body.classList.toggle('under', under); lever.textContent = under ? 'GO BACK UP' : 'PULL THE LEVER';
    capDefault = under ? HINT_UNDER : HINT; cap.innerHTML = capDefault;
  }
  lever.addEventListener('click', function () { flip(!document.body.classList.contains('under')); });
  var lightBtn = document.getElementById('light'); function lightLabel(p) { lightBtn.textContent = 'LIGHT: ' + p.label; } lightLabel(FT.Lighting.preset());
  lightBtn.addEventListener('click', function () { lightLabel(FT.Lighting.preset('next')); });   // dim, soft, bright; remembered for next time
  soundBtn.addEventListener('click', function () { var on = town.sound(); soundBtn.textContent = on ? 'SOUND: ON' : 'SOUND: OFF'; soundBtn.setAttribute('aria-pressed', on ? 'true' : 'false'); });
  var q = new URLSearchParams(location.search), z = q.get('zoom');
  if (z) { z = z.split(',').map(Number); document.body.classList.add('zoom'); stage.style.width = (W * z[2]) + 'px'; stage.style.height = (H * z[2]) + 'px'; stage.style.left = (-z[0] * z[2]) + 'px'; stage.style.top = (-z[1] * z[2]) + 'px'; }
  var go = function () { town = T.start(stage); if (q.has('under')) { document.body.classList.add('under'); lever.textContent = 'GO BACK UP'; capDefault = HINT_UNDER; cap.innerHTML = capDefault; }
    if (q.has('pullat')) setTimeout(function () { flip(true); }, +q.get('pullat') * 1000);   // (preview: pull the lever by itself)
    if (q.has('backat')) setTimeout(function () { flip(false); }, +q.get('backat') * 1000);
    if (q.has('glimpse')) open('A LIT WINDOW', '<p>' + ROOMS[q.get('glimpse')][1] + '</p>', [['GO TO ' + ROOMS[q.get('glimpse')][3], ROOMS[q.get('glimpse')][2]]], ROOMS[q.get('glimpse')][0]); };
  (document.fonts && document.fonts.load ? document.fonts.load('20px VT323') : Promise.resolve()).then(go, go);
});
</script>
</body>
</html>
